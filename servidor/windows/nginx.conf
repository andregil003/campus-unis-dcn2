worker_processes  1;

error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  256;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  30;

    # El index.html usa UTF-8 (guion largo, tildes): declararlo explicito evita
    # que el navegador adivine la codificacion y muestre caracteres rotos.
    charset utf-8;

    access_log  logs/access.log;

    server {
        listen       80;
        server_name  _;

        root   html;
        index  index.html;

        # S-04: endpoint de salud, sin archivo en disco
        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
