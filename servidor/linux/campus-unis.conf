# Sitio "campus" — servidor de sede sobre nginx de Linux / Raspberry Pi OS
#
# Este archivo es un ARCHIVO DE SITIO (bloque `server`), NO un nginx.conf completo.
# Va dentro de http{} porque Debian lo incluye desde /etc/nginx/nginx.conf.
#
# Instalación (ver docs/12-SERVIDOR-SUR.md §6):
#   sudo cp servidor/linux/campus-unis.conf /etc/nginx/sites-available/campus
#   sudo ln -sf /etc/nginx/sites-available/campus /etc/nginx/sites-enabled/campus
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl restart nginx

server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    root   /var/www/campus;
    index  index.html;

    # El index.html usa UTF-8 (guion largo, tildes): declararlo explícito evita
    # que el navegador adivine la codificación y muestre caracteres rotos.
    charset utf-8;

    access_log /var/log/nginx/campus.access.log;
    error_log  /var/log/nginx/campus.error.log warn;

    # S-04: endpoint de salud, sin archivo en disco
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
